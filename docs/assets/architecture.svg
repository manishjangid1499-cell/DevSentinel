<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="box-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="900" height="360" fill="#0b0f19" rx="8"/>

  <!-- Block 1: React 19 Frontend -->
  <rect x="30" y="50" width="220" height="260" rx="10" fill="url(#box-grad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#box-shadow)"/>
  <rect x="50" y="70" width="180" height="30" rx="6" fill="#3b82f6"/>
  <text x="140" y="90" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">React 19 Frontend</text>
  <text x="50" y="130" fill="#94a3b8" font-size="12">• Real-time Trajectory UI</text>
  <text x="50" y="155" fill="#94a3b8" font-size="12">• Unified Colored Diff Viewer</text>
  <text x="50" y="180" fill="#94a3b8" font-size="12">• Live Telemetry Metrics</text>
  <text x="50" y="205" fill="#94a3b8" font-size="12">• Human-in-the-Loop Controls</text>
  <rect x="50" y="240" width="180" height="40" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="140" y="265" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">HITL Approval Drawer</text>

  <!-- Arrow 1 -->
  <path d="M 250 180 L 320 180" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="170" fill="#06b6d4" font-size="10" text-anchor="middle">REST / JSON</text>

  <!-- Block 2: FastAPI Backend -->
  <rect x="330" y="50" width="240" height="260" rx="10" fill="url(#box-grad)" stroke="#06b6d4" stroke-width="1.5" filter="url(#box-shadow)"/>
  <rect x="350" y="70" width="200" height="30" rx="6" fill="#06b6d4"/>
  <text x="450" y="90" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">FastAPI Core Backend</text>
  <text x="350" y="130" fill="#94a3b8" font-size="12">• REST API Router (/api/jobs)</text>
  <text x="350" y="155" fill="#94a3b8" font-size="12">• Asynchronous Job Dispatcher</text>
  <text x="350" y="180" fill="#94a3b8" font-size="12">• SQLAlchemy Database ORM</text>
  <text x="350" y="205" fill="#94a3b8" font-size="12">• Audit Trail &amp; Cost Telemetry</text>
  <rect x="350" y="240" width="200" height="40" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6"/>
  <text x="450" y="265" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">SQLite / PostgreSQL DB</text>

  <!-- Arrow 2 -->
  <path d="M 570 180 L 640 180" stroke="#f59e0b" stroke-width="2"/>
  <text x="605" y="170" fill="#f59e0b" font-size="10" text-anchor="middle">Subprocess IPC</text>

  <!-- Block 3: Agentic Engine & Sandbox -->
  <rect x="650" y="50" width="220" height="260" rx="10" fill="url(#box-grad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#box-shadow)"/>
  <rect x="670" y="70" width="180" height="30" rx="6" fill="#f59e0b"/>
  <text x="760" y="90" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">DevSentinel Agent</text>
  <text x="670" y="130" fill="#94a3b8" font-size="12">• Reconnaissance &amp; AST Scan</text>
  <text x="670" y="155" fill="#94a3b8" font-size="12">• Pytest Test Synthesis</text>
  <text x="670" y="180" fill="#94a3b8" font-size="12">• Isolated Process Sandbox</text>
  <text x="670" y="205" fill="#94a3b8" font-size="12">• Cross-Platform Tree Kill</text>
  <rect x="670" y="240" width="180" height="40" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b"/>
  <text x="760" y="265" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">LLM + Pytest Sandbox</text>
</svg>
